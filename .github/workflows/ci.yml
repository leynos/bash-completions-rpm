name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs of the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [fedora-43, rocky-10]
    steps:
      # Actions are pinned by commit SHA, matching the digest pinning used for
      # the build/test container images.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install tmt
        run: pipx install 'tmt[provision-container]'

      # test-<target> depends on rpm-<target>, so one invocation builds the
      # RPMs and then runs the tmt plan against them. The output is teed to a
      # log so the build's structured diagnostics survive a failure; pipefail
      # keeps make's exit status rather than tee's. build-rpm.sh never logs
      # the tarball URL or any other secret-bearing input, so the log is safe
      # to upload.
      - name: Build RPMs and run tmt plan
        run: |
          set -o pipefail
          make test-${{ matrix.target }} 2>&1 | tee build-${{ matrix.target }}.log

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            /var/tmp/tmt/${{ matrix.target }}
            build-${{ matrix.target }}.log
          if-no-files-found: ignore

      - name: Upload RPMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpms-${{ matrix.target }}
          path: dist/${{ matrix.target }}/
